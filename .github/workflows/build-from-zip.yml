name: Build Simple Planes Fabric 1.21.1

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Extract source archive
        run: |
          test -f source.zip
          mkdir project
          unzip -q source.zip -d project
          test -f project/settings.gradle
      - name: Apply simple compatibility fixes
        shell: bash
        run: |
          ROOT="project/src/main/java/xyz/przemyk/simpleplanes"
          sed -i 's/import javax.annotation.Nullable;/import org.jetbrains.annotations.Nullable;/' "$ROOT/entities/PlaneEntity.java" "$ROOT/blocks/ChargingStationBlock.java" "$ROOT/blocks/PlaneWorkbenchBlock.java" "$ROOT/items/PlaneItem.java"
          sed -i 's/import javax.annotation.Nonnull;/import org.jetbrains.annotations.NotNull;/; s/@Nonnull/@NotNull/g' "$ROOT/container/FuelSlot.java"
          sed -i 's/RecordItem/MusicDiscItem/g' "$ROOT/client/MovingSound.java" "$ROOT/upgrades/jukebox/JukeboxUpgrade.java"
          sed -i 's/import net.fabricmc.fabric.api.object.builder.v1.entity.FabricEntityDataRegistry;/import net.minecraft.core.Registry;\nimport net.minecraft.core.registries.BuiltInRegistries;/' "$ROOT/setup/SimplePlanesDataSerializers.java"
          sed -i 's/FabricEntityDataRegistry.register(/Registry.register(BuiltInRegistries.ENTITY_DATA_SERIALIZER,/' "$ROOT/setup/SimplePlanesDataSerializers.java"
          sed -i 's/import com.mojang.math.Matrix4f;//' "$ROOT/client/ClientUtil.java"
          sed -i 's/import net.minecraft.client.gui.GuiComponent;/import net.minecraft.client.gui.GuiGraphics;/' "$ROOT/client/ClientUtil.java"
          grep -q 'org.jetbrains:annotations' project/build.gradle || sed -i '/fabric-api:/a\    compileOnly "org.jetbrains:annotations:26.0.2"' project/build.gradle
      - name: Build mod
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simple-planes-fabric-1.21.1
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
