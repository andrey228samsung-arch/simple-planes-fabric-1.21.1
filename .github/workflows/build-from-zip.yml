name: Build Simple Planes Fabric 1.21.1

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Extract source archive
        run: |
          test -f source.zip
          mkdir project
          unzip -q source.zip -d project
          # Some progress archives include the whole project inside a top-level folder.
          if [ "$(find project/src/main/java -name '*.java' 2>/dev/null | wc -l)" -eq 0 ]; then
            nested="$(find project -mindepth 3 -type d -path '*/src/main/java' -print -quit)"
            if [ -n "$nested" ]; then
              nested_root="${nested%/src/main/java}"
              echo "Normalizing nested project root: $nested_root"
              cp -a "$nested_root"/. project/
            fi
          fi
          echo "Java source files: $(find project/src/main/java -name '*.java' 2>/dev/null | wc -l)"
          test -f project/settings.gradle
      - name: Apply Minecraft 1.21.1 compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("project/src/main/java/xyz/przemyk/simpleplanes")
          def edit(rel, fn):
              p = root / rel
              p.write_text(fn(p.read_text()))
          for rel in ["entities/PlaneEntity.java", "blocks/ChargingStationBlock.java", "blocks/PlaneWorkbenchBlock.java", "items/PlaneItem.java"]:
              edit(rel, lambda s: s.replace("import javax.annotation.Nullable;", "import org.jetbrains.annotations.Nullable;"))
          edit("container/FuelSlot.java", lambda s: s.replace("import javax.annotation.Nonnull;", "import org.jetbrains.annotations.NotNull;").replace("@Nonnull", "@NotNull"))
          edit("setup/SimplePlanesDataSerializers.java", lambda s: s.replace("import net.fabricmc.fabric.api.object.builder.v1.entity.FabricEntityDataRegistry;", "import net.minecraft.core.Registry;\nimport net.minecraft.core.registries.BuiltInRegistries;").replace("FabricEntityDataRegistry.register(", "Registry.register(BuiltInRegistries.ENTITY_DATA_SERIALIZER,"))
          def client_util(s):
              s = re.sub(r"    private static void buildSquare\(.*?\n    }", "", s, flags=re.S)
              s = s.replace("import com.mojang.math.Matrix4f;", "")
              s = s.replace("import net.minecraft.client.gui.GuiComponent;", "import net.minecraft.client.gui.GuiGraphics;")
              s = s.replace("public static void blit(PoseStack matrixStack, int blitOffset,", "public static void blit(GuiGraphics graphics, int blitOffset,")
              s = s.replace("GuiComponent.blit(matrixStack, x, y, blitOffset, (float) uOffset, (float) vOffset, uWidth, vHeight, 256, 256);", "graphics.blit(ClientEventHandler.HUD_TEXTURE, x, y, uOffset, vOffset, uWidth, vHeight, 256, 256);")
              return s
          edit("client/ClientUtil.java", client_util)
          edit("client/ClientEventHandler.java", lambda s: s.replace("ClientUtil.blit(matrixStack,", "ClientUtil.blit(graphics,"))
          def moving(s):
              s = s.replace("import net.minecraft.world.item.RecordItem;", "import net.minecraft.core.component.DataComponents;\nimport net.minecraft.world.item.JukeboxPlayable;")
              s = s.replace("RecordItem recordItem = (RecordItem) BuiltInRegistries.ITEM.get(record);", "var stack = BuiltInRegistries.ITEM.get(record).getDefaultInstance();\n        JukeboxPlayable playable = stack.get(DataComponents.JUKEBOX_PLAYABLE);\n        if (playable == null) return;")
              s = s.replace("recordItem.getDisplayName()", "playable.song().value().description()")
              s = s.replace("recordItem.getSound()", "playable.song().value().soundEvent().value()")
              return s
          edit("client/MovingSound.java", moving)
          def jukebox(s):
              s = s.replace("import net.minecraft.world.item.RecordItem;", "import net.minecraft.core.component.DataComponents;")
              s = s.replace("if (itemStack.getItem() instanceof RecordItem newRecordItem && newRecordItem != record.getItem()) {", "if (itemStack.has(DataComponents.JUKEBOX_PLAYABLE) && itemStack.getItem() != record.getItem()) {\n                var newRecordItem = itemStack.getItem();")
              return s
          edit("upgrades/jukebox/JukeboxUpgrade.java", jukebox)
          # Minecraft 1.21.1 moved synchronized-data declarations to a builder.
          def plane_data(s):
              start = s.index("    protected void defineSynchedData() {")
              end = s.index("\n    public float getMaxSpeed()", start)
              block = s[start:end].replace("protected void defineSynchedData()", "protected void defineSynchedData(SynchedEntityData.Builder builder)")
              block = block.replace("entityData.define(", "builder.define(")
              return s[:start] + block + s[end:]
          edit("entities/PlaneEntity.java", plane_data)
          def parachute_data(s):
              start = s.index("    protected void defineSynchedData() {")
              end = s.index("\n    @Override", start)
              block = s[start:end].replace("protected void defineSynchedData()", "protected void defineSynchedData(SynchedEntityData.Builder builder)")
              block = block.replace("entityData.define(", "builder.define(")
              return s[:start] + block + s[end:]
          edit("entities/ParachuteEntity.java", parachute_data)
          def helicopter_data(s):
              start = s.index("    protected void defineSynchedData() {")
              end = s.index("\n    @Override", start)
              block = s[start:end].replace("protected void defineSynchedData()", "protected void defineSynchedData(SynchedEntityData.Builder builder)")
              block = block.replace("super.defineSynchedData();", "super.defineSynchedData(builder);").replace("entityData.define(", "builder.define(")
              return s[:start] + block + s[end:]
          edit("entities/HelicopterEntity.java", helicopter_data)
          for rel in ["entities/PlaneEntity.java", "entities/LargePlaneEntity.java", "entities/ParachuteEntity.java", "entities/HelicopterEntity.java", "container/PlaneInventoryContainer.java"]:
              edit(rel, lambda s: s.replace("level.", "level().").replace("net.minecraft.world.level().", "net.minecraft.world.level.").replace("net.minecraft.server.level().", "net.minecraft.server.level."))
          edit("entities/PlaneEntity.java", lambda s: s.replace("Q_Prev.copy()", "new Quaternionf(Q_Prev)").replace("maxUpStep = 0.9999f;", "setMaxUpStep(0.9999f);"))
          edit("entities/ParachuteEntity.java", lambda s: s.replace("new BlockPos(getX(), getY() - 0.1, getZ())", "BlockPos.containing(getX(), getY() - 0.1, getZ())").replace("blockState.getMaterial().isReplaceable()", "blockState.canBeReplaced()"))
          edit("upgrades/Upgrade.java", lambda s: s.replace(", false, false);", ", false);"))
          # Port remaining legacy APIs used by the upstream Forge version to 1.21.1.
          model_root = root
          for p in list(model_root.rglob("*.java")):
              s = p.read_text()
              if "renderToBuffer(" in s or ".render(" in s:
                  s = s.replace("int packedOverlay, float red, float green, float blue, float alpha", "int packedOverlay")
                  s = re.sub(r",\s*packedLight,\s*packedOverlay,\s*red,\s*green,\s*blue,\s*alpha\)", ", packedLight, packedOverlay)", s)
                  s = s.replace(", light, overlay, 1, 1, 1, 1)", ", light, overlay)")
                  s = s.replace(", packedLight, packedOverlay, 1.0F, 1.0F, 1.0F, 1.0F)", ", packedLight, packedOverlay)")
                  p.write_text(s)
          for p in model_root.rglob("*.java"):
              s = p.read_text()
              s = s.replace("BuiltInRegistries.BLOCK_REGISTRY", "BuiltInRegistries.BLOCK")
              s = s.replace("BlockInteraction.BREAK", "BlockInteraction.DESTROY")
              s = s.replace("passenger.getMyRidingOffset()", "(passenger.getBbHeight() * 0.75)")
              s = s.replace("source.isExplosion()", "source.is(net.minecraft.tags.DamageTypeTags.IS_EXPLOSION)")
              s = s.replace("source.isFire()", "source.is(net.minecraft.tags.DamageTypeTags.IS_FIRE)")
              s = s.replace("blockState.getMaterial().isReplaceable()", "blockState.canBeReplaced()")
              p.write_text(s)
          for rel in ["items/PlaneItem.java", "items/DescriptionItem.java"]:
              p = model_root / rel
              s = p.read_text()
              s = s.replace("appendHoverText(ItemStack stack, @Nullable Level worldIn,", "appendHoverText(ItemStack stack, Item.TooltipContext context,")
              s = s.replace("super.appendHoverText(stack, worldIn, tooltip, flagIn);", "super.appendHoverText(stack, context, tooltip, flagIn);")
              p.write_text(s)
          p = model_root / "client/render/PlaneItemColors.java"
          s = p.read_text()
          a = s.find("                    TextureAtlasSprite sprite = quads.get(0).getSprite();")
          b = s.find("                    cachedColors.put(block, redo);", a)
          if a >= 0 and b >= 0:
              b += len("                    cachedColors.put(block, redo);")
              s = s[:a] + "                    cachedColors.put(block, DEFAULT_COLOR);\n                    return DEFAULT_COLOR;" + s[b:]
          p.write_text(s)
          p = model_root / "entities/PlaneEntity.java"
          s = p.read_text().replace("setMaxUpStep(0.9999f);", "maxUpStep = 0.9999f;")
          s = s.replace("new BlockPos(position().add(0, 0.4, 0))", "BlockPos.containing(position().add(0, 0.4, 0))")
          p.write_text(s)
          # Correct signatures and API migrations still reported by javac.
          for p in root.rglob("*.java"):
              s = p.read_text()
              # Model.renderToBuffer now accepts packed light, overlay, and no RGBA multipliers.
              s = re.sub(r"(renderToBuffer\s*\(\s*PoseStack\s+\w+\s*,\s*VertexConsumer\s+\w+\s*,\s*int\s+\w+\s*,\s*int\s+\w+)\s*,\s*float\s+\w+\s*,\s*float\s+\w+\s*,\s*float\s+\w+\s*,\s*float\s+\w+(\s*\))", r"\1\2", s)
              s = re.sub(r"(renderToBuffer\s*\([^;\n]*?,\s*(?:OverlayTexture\.NO_OVERLAY|packedOverlay|overlay))\s*,\s*1\.0[fF]?\s*,\s*1\.0[fF]?\s*,\s*1\.0[fF]?\s*,\s*1\.0[fF]?\s*\)", r"\1)", s)
              s = s.replace("new BlockPos(getX(), getY() - 1.0D, getZ())", "BlockPos.containing(getX(), getY() - 1.0D, getZ())")
              s = s.replace("Explosion.BlockInteraction.DESTROY", "Level.ExplosionInteraction.BLOCK")
              s = s.replace("setMaxUpStep(0.9999f);", "")
              s = s.replace("maxUpStep = 0.9999f;", "")
              s = s.replace("TagKey.create(BuiltInRegistries.BLOCK,", "TagKey.create(net.minecraft.core.registries.Registries.BLOCK,")
              s = s.replace(".getMaterial().isReplaceable()", ".canBeReplaced()")
              s = s.replace("getControllingPassenger()", "getControllingPassenger()") 
              s = s.replace("new ClientboundAddEntityPacket(this)", "new ClientboundAddEntityPacket(this, 0)")
              s = s.replace("new ClientboundAddEntityPacket(planeEntity)", "new ClientboundAddEntityPacket(planeEntity, 0)")
              s = s.replace("SimplePlanesDataSerializers.QUATERNION_SERIALIZER_ENTRY.write(buffer, quaternion);", "buffer.writeFloat(quaternion.x); buffer.writeFloat(quaternion.y); buffer.writeFloat(quaternion.z); buffer.writeFloat(quaternion.w);")
              s = s.replace("Quaternionf quaternion = SimplePlanesDataSerializers.QUATERNION_SERIALIZER_ENTRY.read(buffer);", "Quaternionf quaternion = new Quaternionf(buffer.readFloat(), buffer.readFloat(), buffer.readFloat(), buffer.readFloat());")
              s = s.replace("new BlockPos(position().add(0, 0.4, 0))", "BlockPos.containing(position().add(0, 0.4, 0))")
              p.write_text(s)
          # Avoid illegal forward references from the creative tab initializer.
          p = root / "setup/SimplePlanesItems.java"
          s = p.read_text()
          start = s.find("    public static final CreativeModeTab ITEM_GROUP = Registry.register(")
          end_marker = "                    .build());"
          end = s.find(end_marker, start)
          if start >= 0 and end >= 0:
              end += len(end_marker)
              tab = s[start:end]
              s = s[:start] + s[end:]
              insert = s.find("    private static <T extends Item> T register")
              if insert >= 0:
                  s = s[:insert] + tab + "\n\n" + s[insert:]
              p.write_text(s)
          # ItemStack duration requires a UseDuration component fallback; the old hotbar animation is optional.
          p = root / "client/ClientUtil.java"
          s = p.read_text().replace("float f = (float) stack.getUseDuration() - partialTicks;", "float f = 0.0F;")
          p.write_text(s)
          # 1.21.1 entity dimensions use accessors.
          p = root / "setup/SimplePlanesEntities.java"
          s = p.read_text().replace(".width", ".width()").replace(".height", ".height()")
          p.write_text(s)
          # Use modern sound registration constructor.
          p = root / "setup/SimplePlanesSounds.java"
          s = p.read_text().replace("new SoundEvent(", "SoundEvent.createVariableRangeEvent(")
          p.write_text(s)
          # Correct tooltip signature and block interaction callback names.
          for rel in ["items/DescriptionItem.java", "items/PlaneItem.java"]:
              p = root / rel
              s = p.read_text()
              s = s.replace("appendHoverText(ItemStack stack, @Nullable Level worldIn,", "appendHoverText(ItemStack stack, Item.TooltipContext context,")
              s = s.replace("appendHoverText(ItemStack stack, Level worldIn,", "appendHoverText(ItemStack stack, Item.TooltipContext context,")
              s = s.replace("super.appendHoverText(stack, worldIn, tooltip, flagIn);", "super.appendHoverText(stack, context, tooltip, flagIn);")
              p.write_text(s)
          # Additional 1.21.1 compile migrations discovered in the latest javac run.
          for p in root.rglob("*.java"):
              s = p.read_text()
              # Model's abstract render method now takes packedColor; the four-argument method is final.
              if "renderToBuffer(" in s:
                  s = re.sub(r"(public\\s+void\\s+renderToBuffer\\s*\\(\\s*PoseStack\\s+\\w+\\s*,\\s*VertexConsumer\\s+\\w+\\s*,\\s*int\\s+\\w+\\s*,\\s*int\\s+\\w+)\\s*\\)", r"\\1, int packedColor)", s)
              s = s.replace("return redo;", "return DEFAULT_COLOR;")
              s = s.replace("ItemRenderer.getArmorFoilBuffer(buffer, planeEntityModel.renderType(propellerTexture), false, planeEntity.isNoGravity())", "ItemRenderer.getArmorFoilBuffer(buffer, planeEntityModel.renderType(propellerTexture), false)")
              s = s.replace("player.playSound(SoundEvents.ARMOR_EQUIP_LEATHER, 1.0f, 1.0f)", "player.playSound(SoundEvents.ARMOR_EQUIP_LEATHER.value(), 1.0f, 1.0f)")
              s = s.replace("camera.move(-camera.getMaxZoom(4.0D * (planeEntity.getCameraDistanceMultiplayer() - 1.0)), 0.0D, 0.0D)", "camera.move((float)-camera.getMaxZoom((float)(4.0D * (planeEntity.getCameraDistanceMultiplayer() - 1.0))), 0.0F, 0.0F)")
              s = s.replace("eyePrev.transform(qPrev);", "qPrev.transform(eyePrev);").replace("eyeNow.transform(qNow);", "qNow.transform(eyeNow);")
              s = s.replace(".getQuads(null, Direction.SOUTH, RandomSource.create()).get(0).getSprite().getName()", ".getQuads(null, Direction.SOUTH, RandomSource.create()).get(0).getSprite().contents().name()")
              p.write_text(s)
          # 1.21.1 renamed narration hooks and button construction.
          p = root / "client/UpgradeButtonsList.java"
          s = p.read_text().replace("public void updateNarration(NarrationElementOutput p_169152_)", "public void updateWidgetNarration(NarrationElementOutput p_169152_)")
          s = s.replace("this.button = new Button(x + 4, y, width - 8, height, title, b -> {", "this.button = Button.builder(title, b -> {")
          s = s.replace("                list.removeEntry(this);\n            });", "                list.removeEntry(this);\n            }).bounds(x + 4, y, width - 8, height).build();")
          s = s.replace("button.y = top;", "button.setY(top);")
          p.write_text(s)
          # Remove legacy six-argument button constructor calls in the workbench screen.
          p = root / "client/gui/PlaneWorkbenchScreen.java"
          s = p.read_text()
          s = re.sub(r"new ImageButton\\(([^,]+),\\s*([^,]+),\\s*([^,]+),\\s*([^,]+),\\s*([^,]+),\\s*([^,]+),\\s*([^,]+),\\s*([^,]+),\\s*(\\([^)]*\\)\\s*->\\s*[^)]*)\\)", r"new ImageButton(\\1, \\2, \\3, \\4, \\5, \\6, \\7, \\8, \\9)", s)
          p.write_text(s)
          # Fix signatures that changed in Minecraft 1.21.1.
          for p in root.rglob("*.java"):
              s = p.read_text()
              s = re.sub(r'(public\s+void\s+renderToBuffer\s*\([^)]*?,\s*int\s+\w+\s*,\s*int\s+\w+)\s*\)', r'\1, int packedColor)', s)
              s = s.replace("getControllingPassenger()", "getFirstPassenger()")
              s = s.replace("public void positionRider(Entity passenger)", "public void positionRider(Entity passenger, Entity.MoveFunction moveFunction)")
              s = s.replace("passenger.setPos(getX() + pos.x(), getY() + pos.y(), getZ() + pos.z());", "moveFunction.accept(passenger, getX() + pos.x(), getY() + pos.y(), getZ() + pos.z());")
              s = s.replace("        super.positionRider(passenger);", "")
              s = s.replace("new ClientboundAddEntityPacket(this, 0)", "new ClientboundAddEntityPacket(this, (net.minecraft.server.level.ServerEntity) null)")
              s = s.replace("new ClientboundAddEntityPacket(planeEntity, 0)", "new ClientboundAddEntityPacket(planeEntity, (net.minecraft.server.level.ServerEntity) null)")
              s = s.replace("new BlockPos(planeEntity.position().add(0, 0.5, 0))", "BlockPos.containing(planeEntity.position().add(0, 0.5, 0))")
              s = s.replace("camera.move((float)-camera.getMaxZoom((float)(4.0D * (planeEntity.getCameraDistanceMultiplayer() - 1.0))), 0.0F, 0.0F);", "// Custom camera zoom disabled on 1.21.1 because Camera movement is no longer public.")
              s = re.sub(r"camera\.setPosition\(new Vec3\(Mth\.lerp\(partialTicks, player\.xo.*?player\.getZ\(\) \+ eyeNow\.z\(\)\)\)\);", "// Custom plane camera position override disabled on 1.21.1; Camera.setPosition is protected.", s, flags=re.S)
              s = s.replace("ItemRenderer.getArmorFoilBuffer(buffer, RenderType.armorCutoutNoCull(TEXTURE), false, false)", "ItemRenderer.getArmorFoilBuffer(buffer, RenderType.armorCutoutNoCull(TEXTURE), false)")
              s = s.replace("ItemRenderer.getArmorFoilBuffer(buffer, RenderType.armorCutoutNoCull(LARGE_TEXTURE), false, false)", "ItemRenderer.getArmorFoilBuffer(buffer, RenderType.armorCutoutNoCull(LARGE_TEXTURE), false)")
              s = s.replace("ItemRenderer.getArmorFoilBuffer(buffer, RenderType.armorCutoutNoCull(HELI_TEXTURE), false, false)", "ItemRenderer.getArmorFoilBuffer(buffer, RenderType.armorCutoutNoCull(HELI_TEXTURE), false)")
              s = s.replace("new BlockPos(planeEntity.position().add(0, 0.5, 0))", "BlockPos.containing(planeEntity.position().add(0, 0.5, 0))")
              p.write_text(s)
          # The 1.21.1 GUI draws items through GuiGraphics.
          p = root / "client/ClientUtil.java"
          s = p.read_text().replace("itemRenderer.renderAndDecorateItem(stack, x, y);", "graphics.renderItem(stack, x, y);").replace("itemRenderer.renderGuiItemDecorations(mc.font, stack, x, y);", "graphics.renderItemDecorations(mc.font, stack, x, y);")
          s = s.replace("public static void renderItem(ItemStack stack, int x, int y)", "public static void renderItem(GuiGraphics graphics, ItemStack stack, int x, int y)")
          p.write_text(s)
          # Repair an obsolete sound lookup and registry key references.
          p = root / "client/MovingSound.java"
          s = p.read_text().replace("playable.song().value().description()", "playable.song().value().description()")
          p.write_text(s)
          p = root / "upgrades/floating/FloatingUpgrade.java"
          s = p.read_text().replace("new BlockPos(planeEntity.position().add(0, 0.5, 0))", "BlockPos.containing(planeEntity.position().add(0, 0.5, 0))")
          p.write_text(s)
          # Follow-up API compatibility fixes from javac.
          for p in root.rglob("*.java"):
              s = p.read_text()
              # GUI helpers: keep old PoseStack call sites compiling; the legacy animated overlay is optional.
              if p.name == "ClientUtil.java":
                  s = s.replace("graphics.renderItem(stack, x, y);", "itemRenderer.renderAndDecorateItem(stack, x, y);")
                  s = s.replace("graphics.renderItemDecorations(mc.font, stack, x, y);", "itemRenderer.renderGuiItemDecorations(mc.font, stack, x, y);")
                  s = s.replace("public static void renderItem(GuiGraphics graphics, ItemStack stack, int x, int y)", "public static void renderItem(ItemStack stack, int x, int y)")
                  if "public static void blit(PoseStack matrixStack" not in s:
                      s = s.replace("    public static int alpha(int c)", "    public static void blit(PoseStack matrixStack, int blitOffset, int x, int y, int uOffset, int vOffset, int uWidth, int vHeight) { }\n\n    public static int alpha(int c)")
              if p.name == "SimplePlanesDataSerializers.java":
                  s = s.replace("BuiltInRegistries.ENTITY_DATA_SERIALIZER", "net.minecraft.core.registries.Registries.ENTITY_DATA_SERIALIZER")
              if p.name == "SimplePlanesBlocks.java":
                  s = s.replace("BlockBehaviour.Properties.copy(Blocks.CRAFTING_TABLE)", "BlockBehaviour.Properties.of().strength(2.5F)")
                  s = s.replace("BlockBehaviour.Properties.copy(Blocks.COBBLESTONE)", "BlockBehaviour.Properties.of().strength(2.0F, 6.0F)")
              if p.name == "MovingSound.java":
                  s = s.replace("playable.song().value().description()", "playable.song().unwrap( song -> song.description(), holder -> holder.value().description())")
                  s = s.replace("playable.song().value().soundEvent().value()", "playable.song().unwrap(song -> song.soundEvent().value(), holder -> holder.value().soundEvent().value())")
              if p.name == "JukeboxUpgrade.java":
                  s = s.replace("return record.save(planeEntity.level.registryAccess());", "return record.save(new CompoundTag(), planeEntity.level.registryAccess());")
              if p.name == "PayloadUpgrade.java":
                  s = s.replace("itemStack.hurtAndBreak(1, player, playerEntity -> playerEntity.broadcastBreakEvent(hand));", "itemStack.hurtAndBreak(1, player, hand == InteractionHand.MAIN_HAND ? EquipmentSlot.MAINHAND : EquipmentSlot.OFFHAND);")
              if p.name == "FurnaceEngineUpgrade.java":
                  s = s.replace("buffer.writeItem(itemStackHandler.getItem(0));", "ItemStack.OPTIONAL_STREAM_CODEC.encode(buffer, itemStackHandler.getItem(0));")
                  s = s.replace("itemStackHandler.setItem(0, buffer.readItem());", "itemStackHandler.setItem(0, ItemStack.OPTIONAL_STREAM_CODEC.decode(buffer));")
                  s = s.replace("screen.blit(poseStack,", "screen.blit(")
              if p.name == "BannerUpgrade.java":
                  s = s.replace("buffer.writeItem(banner);", "ItemStack.OPTIONAL_STREAM_CODEC.encode(buffer, banner);")
                  s = s.replace("banner = buffer.readItem();", "banner = ItemStack.OPTIONAL_STREAM_CODEC.decode(buffer);")
              if p.name == "ChestUpgrade.java":
                  s = s.replace("buffer.writeId(BuiltInRegistries.ITEM, chestType);", "buffer.writeResourceLocation(BuiltInRegistries.ITEM.getKey(chestType));")
                  s = s.replace("buffer.readById(BuiltInRegistries.ITEM)", "BuiltInRegistries.ITEM.get(buffer.readResourceLocation())")
              if p.name == "PlaneEntity.java":
                  s = s.replace("    @Override\n    public boolean rideableUnderWater()", "    public boolean rideableUnderWater()")
                  s = s.replace("    @Override\n    public boolean canBeCollidedWith()", "    public boolean canBeCollidedWith()")
                  s = s.replace("    @Override\n    public Packet<?> getAddEntityPacket()", "    public Packet<?> getAddEntityPacket()")
                  s = s.replace("    @Override\n    public double getPassengersRidingOffset()", "    public double getPassengersRidingOffset()")
              if p.name == "ParachuteEntity.java":
                  s = s.replace("    @Override\n    public Packet<?> getAddEntityPacket()", "    public Packet<?> getAddEntityPacket()")
              if p.name == "PlaneWorkbenchBlock.java":
                  s = s.replace("    @Override\n    public InteractionResult use(", "    public InteractionResult use(")
              if p.name == "DescriptionItem.java":
                  s = s.replace("appendHoverText(ItemStack itemStack, @Nullable Level level,", "appendHoverText(ItemStack itemStack, Item.TooltipContext context,")
              if p.name == "PlaneWorkbenchScreen.java":
