name: Build Simple Planes Fabric 1.21.1

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Extract source archive
        run: |
          test -f source.zip
          mkdir project
          unzip -q source.zip -d project
          test -f project/settings.gradle
      - name: Apply Minecraft 1.21.1 compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("project/src/main/java/xyz/przemyk/simpleplanes")
          def edit(rel, fn):
              p = root / rel
              p.write_text(fn(p.read_text()))
          for rel in ["entities/PlaneEntity.java", "blocks/ChargingStationBlock.java", "blocks/PlaneWorkbenchBlock.java", "items/PlaneItem.java"]:
              edit(rel, lambda s: s.replace("import javax.annotation.Nullable;", "import org.jetbrains.annotations.Nullable;"))
          edit("container/FuelSlot.java", lambda s: s.replace("import javax.annotation.Nonnull;", "import org.jetbrains.annotations.NotNull;").replace("@Nonnull", "@NotNull"))
          edit("setup/SimplePlanesDataSerializers.java", lambda s: s.replace("import net.fabricmc.fabric.api.object.builder.v1.entity.FabricEntityDataRegistry;", "import net.minecraft.core.Registry;\nimport net.minecraft.core.registries.BuiltInRegistries;").replace("FabricEntityDataRegistry.register(", "Registry.register(BuiltInRegistries.ENTITY_DATA_SERIALIZER,"))
          edit("client/ClientUtil.java", lambda s: re.sub(r"    private static void buildSquare\(.*?\n    }", "", s, flags=re.S).replace("import com.mojang.math.Matrix4f;", ""))
          # Minecraft 1.21.1 stores disc playback data in the JUKEBOX_PLAYABLE data component.
          def moving(s):
              s = s.replace("import net.minecraft.world.item.MusicDiscItem;", "import net.minecraft.core.component.DataComponents;\nimport net.minecraft.world.item.JukeboxPlayable;")
              s = s.replace("MusicDiscItem recordItem = (MusicDiscItem) BuiltInRegistries.ITEM.get(record);", "var recordItem = BuiltInRegistries.ITEM.get(record);\n        var stack = recordItem.getDefaultInstance();\n        JukeboxPlayable playable = stack.get(DataComponents.JUKEBOX_PLAYABLE);\n        if (playable == null) return;")
              s = s.replace("recordItem.getDisplayName()", "recordItem.getName(stack)")
              s = s.replace("recordItem.getSound()", "playable.song().value().soundEvent().value()")
              return s
          edit("client/MovingSound.java", moving)
          def jukebox(s):
              s = s.replace("import net.minecraft.world.item.MusicDiscItem;", "import net.minecraft.core.component.DataComponents;")
              s = s.replace("if (itemStack.getItem() instanceof MusicDiscItem newMusicDiscItem && newMusicDiscItem != record.getItem()) {", "if (itemStack.has(DataComponents.JUKEBOX_PLAYABLE) && itemStack.getItem() != record.getItem()) {\n                var newMusicDiscItem = itemStack.getItem();")
              return s
          edit("upgrades/jukebox/JukeboxUpgrade.java", jukebox)
          p = Path("project/build.gradle")
          s = p.read_text()
          if "org.jetbrains:annotations" not in s:
              s = s.replace('modImplementation "net.fabricmc.fabric-api:fabric-api:', 'compileOnly "org.jetbrains:annotations:26.0.2"\n    modImplementation "net.fabricmc.fabric-api:fabric-api:')
          p.write_text(s)
          PY
      - name: Build mod
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simple-planes-fabric-1.21.1
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
