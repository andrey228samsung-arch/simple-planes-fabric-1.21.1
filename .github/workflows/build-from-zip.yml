name: Build Simple Planes from source ZIP

on:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Extract source archive
        run: |
          test -f source.zip || { echo "Upload the project archive as source.zip to the repository root."; exit 1; }
          mkdir project
          unzip -q source.zip -d project
          test -f project/settings.gradle || { echo "settings.gradle not found at archive root."; find project -maxdepth 3 -type f | head -50; exit 1; }

      - name: Build mod
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simple-planes-fabric-1.21.1
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
